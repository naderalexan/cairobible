name: iOS

on:
  push:
    branches:
      - main
    paths:
      - "ios/CairoBible/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/CairoBible/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"].values(); print(next(device["udid"] for group in groups for device in group if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build and test on the iOS simulator
        run: >-
          xcodebuild
          -project ios/CairoBible/CairoBible.xcodeproj
          -scheme CairoBible
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          test
          CODE_SIGNING_ALLOWED=NO

  testflight:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: ios
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_ID:?Add the APP_STORE_CONNECT_API_KEY_ID repository secret}"
          : "${APPLE_API_PRIVATE_KEY:?Add the APP_STORE_CONNECT_API_PRIVATE_KEY repository secret}"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Archive and export for App Store Connect
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROVISIONING_PROFILE_BASE64 }}
          APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?Add the APPLE_CERTIFICATE_P12_BASE64 repository secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Add the APPLE_CERTIFICATE_PASSWORD repository secret}"
          : "${APPLE_APP_PROVISIONING_PROFILE_BASE64:?Add the APPLE_APP_PROVISIONING_PROFILE_BASE64 repository secret}"
          : "${APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64:?Add the APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64 repository secret}"
          : "${APPLE_TEAM_ID:?Add the APPLE_DEVELOPER_TEAM_ID repository secret}"

          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          app_profile_path="$RUNNER_TEMP/app.mobileprovision"
          extension_profile_path="$RUNNER_TEMP/extension.mobileprovision"
          python3 - "$certificate_path" "$app_profile_path" "$extension_profile_path" <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          for name, path in zip((
              "APPLE_CERTIFICATE_P12_BASE64",
              "APPLE_APP_PROVISIONING_PROFILE_BASE64",
              "APPLE_EXTENSION_PROVISIONING_PROFILE_BASE64",
          ), sys.argv[1:]):
              content = base64.b64decode("".join(os.environ[name].split()), validate=True)
              output_path = Path(path)
              output_path.write_bytes(content)
              output_path.chmod(0o600)
          PY

          keychain_path="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          trap 'security delete-keychain "$keychain_path" >/dev/null 2>&1 || true' EXIT
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          security cms -D -i "$app_profile_path" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$extension_profile_path" > "$RUNNER_TEMP/extension-profile.plist"
          app_profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app-profile.plist")
          extension_profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/extension-profile.plist")
          cp "$app_profile_path" "$profile_directory/$app_profile_uuid.mobileprovision"
          cp "$extension_profile_path" "$profile_directory/$extension_profile_uuid.mobileprovision"

          xcodebuild archive \
            -project ios/CairoBible/CairoBible.xcodeproj \
            -scheme CairoBible \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CairoBible.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CI_APP_PROVISIONING_PROFILE_UUID="$app_profile_uuid" \
            CI_EXTENSION_PROVISIONING_PROFILE_UUID="$extension_profile_uuid" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"

          exportOptions="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$exportOptions" "$APPLE_TEAM_ID" "$app_profile_uuid" "$extension_profile_uuid" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_bytes(plistlib.dumps({
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": sys.argv[2],
              "provisioningProfiles": {
                  "site.cairolove.bible.reader": sys.argv[3],
                  "site.cairolove.bible.reader.NotificationContent": sys.argv[4],
              },
          }))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CairoBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$exportOptions"

      - name: Upload build to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/CairoBible.ipa" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER_ID"
