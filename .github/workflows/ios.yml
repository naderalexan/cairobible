name: iOS

on:
  push:
    branches:
      - main
    paths:
      - "ios/CairoBible/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/CairoBible/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"].values(); print(next(device["udid"] for group in groups for device in group if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build and test on the iOS simulator
        run: >-
          xcodebuild
          -project ios/CairoBible/CairoBible.xcodeproj
          -scheme CairoBible
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          test
          CODE_SIGNING_ALLOWED=NO

  testflight:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: ios
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_ID:?Add the APP_STORE_CONNECT_API_KEY_ID repository secret}"
          : "${APPLE_API_PRIVATE_KEY:?Add the APP_STORE_CONNECT_API_PRIVATE_KEY repository secret}"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Archive and export for App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER_ID:?Add the APP_STORE_CONNECT_ISSUER_ID repository secret}"
          : "${APPLE_TEAM_ID:?Add the APPLE_DEVELOPER_TEAM_ID repository secret}"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcodebuild archive \
            -project ios/CairoBible/CairoBible.xcodeproj \
            -scheme CairoBible \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CairoBible.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          exportOptions="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$exportOptions" "$APPLE_TEAM_ID" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_bytes(plistlib.dumps({
              "method": "app-store-connect",
              "signingStyle": "automatic",
              "teamID": sys.argv[2],
          }))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CairoBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$exportOptions" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Upload build to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/CairoBible.ipa" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER_ID"
