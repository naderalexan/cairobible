services:
  api:
    build: .
    restart: unless-stopped
    environment:
      API_BIBLE_KEY: ${API_BIBLE_KEY:-}
      NIV_CORPUS_LICENSE_CONFIRMED: ${NIV_CORPUS_LICENSE_CONFIRMED:-false}
      NIV_CORPUS_PATH: /app/var/niv-corpus.json
    volumes:
      - ./var:/app/var
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
