services:
  api:
    build: .
    restart: unless-stopped
    environment:
      API_BIBLE_KEY: ${API_BIBLE_KEY:-}
      NIV_CORPUS_LICENSE_CONFIRMED: ${NIV_CORPUS_LICENSE_CONFIRMED:-false}
      NIV_CORPUS_PATH: /app/var/niv-corpus.json
    volumes:
      - ./var:/app/var
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
